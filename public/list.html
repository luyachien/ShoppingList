<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
  <title>購物清單</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/list.js"></script>
</head>
<body>
  <main id="loading" class="center-screen">
    <div class="spinner" aria-label="載入中"></div>
  </main>

  <main id="fatal" class="center-screen" hidden>
    <p class="fatal-icon" aria-hidden="true">🧺</p>
    <p id="fatal-message"></p>
  </main>

  <main id="login" class="center-screen" hidden>
    <form id="login-form" class="card login-card">
      <p class="login-icon" aria-hidden="true">🛍️</p>
      <h1 id="login-title">購物清單</h1>
      <p class="muted">請輸入旅伴提供的密碼</p>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="密碼" required>
      <button type="submit" class="btn btn-primary">進入清單</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="main" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-title">
          <h1 id="title"></h1>
          <p id="progress" class="muted"></p>
        </div>
        <button id="refresh" type="button" class="icon-btn" aria-label="重新整理">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
      </div>
      <div class="search-row">
        <input id="search" type="search" placeholder="搜尋商品、商店、備註" enterkeyhint="search" autocomplete="off">
        <button id="filter-toggle" type="button" class="icon-btn filter-btn" aria-expanded="false" aria-controls="filter-panel" aria-label="篩選與排序">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M7 12h10M10 18h4"/></svg>
          <span id="filter-badge" class="badge" hidden></span>
        </button>
      </div>
    </header>

    <section id="filter-panel" class="filter-panel" hidden></section>

    <nav class="segmented" aria-label="購買狀態">
      <button type="button" data-view="todo">未購買</button>
      <button type="button" data-view="done">已購買</button>
      <button type="button" data-view="all">全部</button>
    </nav>

    <div id="category-chips" class="chip-row" role="group" aria-label="種類"></div>

    <p id="summary" class="summary muted"></p>
    <ul id="items" class="items"></ul>
    <p id="empty" class="empty muted" hidden></p>
  </div>
</body>
</html>
