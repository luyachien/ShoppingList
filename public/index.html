<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#191919" media="(prefers-color-scheme: dark)">
  <title>購物清單轉換器</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/js/admin.js"></script>
</head>
<body>
  <main id="loading" class="center-screen">
    <div class="spinner" aria-label="載入中"></div>
  </main>

  <main id="login" class="center-screen" hidden>
    <form id="login-form" class="card login-card">
      <p class="login-icon" aria-hidden="true">🧳</p>
      <h1>購物清單轉換器</h1>
      <p class="muted">請輸入管理密碼</p>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="管理密碼" required>
      <button type="submit" class="btn btn-primary">登入</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="main" class="admin" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-title">
          <h1>購物清單轉換器</h1>
          <p class="muted">Notion 資料庫 → 手機購物清單</p>
        </div>
        <button id="logout" type="button" class="btn btn-ghost btn-sm">登出</button>
      </div>
    </header>

    <section class="card step">
      <h2><span class="step-no">1</span>貼上 Notion 資料庫網址</h2>
      <form id="inspect-form" class="stack">
        <input id="notion-url" type="url" inputmode="url" placeholder="https://www.notion.so/…" required>
        <p class="hint muted">可貼公開檢視網址、資料庫連結，或內含資料庫的頁面連結。</p>
        <button type="submit" class="btn btn-primary">轉換</button>
      </form>
      <div id="inspect-result"></div>
    </section>

    <section id="share-step" class="card step" hidden>
      <h2><span class="step-no">3</span>分享給旅伴</h2>
      <div id="share-result"></div>
    </section>

    <section class="lists">
      <h2>已轉換的清單</h2>
      <ul id="lists" class="list-cards"></ul>
      <p id="lists-empty" class="muted" hidden>還沒有轉換過的清單</p>
    </section>
  </div>
</body>
</html>
